
spring:
  application:
    name: my-first-spring-boot-web

  datasource:
    url: jdbc:h2:file:./data/gamesdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update

  h2:
    console:
      enabled: true

app:
  security:
    google-client-id: 616649718379-udqddisrmtuvmg43dpjdtm74i79hgaum.apps.googleusercontent.com
    admin-email: bryanxavier8@gmail.com

com:
  c4-soft:
    springaddons:
      oidc:
        ops:
          - iss: https://accounts.google.com
            jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
            aud: ${app.security.google-client-id}
            username-claim: email

          - iss: accounts.google.com
            jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
            aud: ${app.security.google-client-id}
            username-claim: email

        resourceserver:
          permit-all:
            - /
            - /error

        cors:
          - path: /api/**
            allowed-origin-patterns:
              - http://localhost:5173